services:
  app:
    shm_size: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      platforms:
        - linux/amd64
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./debug-screenshots:/app/debug-screenshots
      - ./hh-state.json:/app/hh-state.json
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    memswap_limit: 3G
    mem_swappiness: 10
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mongo_data:
  redis_data: