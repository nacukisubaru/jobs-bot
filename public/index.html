<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload HH Profile</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
    input[type="file"] { margin: 1rem 0; }
    button { padding: 0.5rem 1rem; border: none; background: #4CAF50; color: white; cursor: pointer; border-radius: 5px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Upload HH Profile</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="profile" required />
      <br/>
      <button type="submit">Upload</button>
    </form>
  </div>
</body>
</html>
